[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo26bench-v2"
version = "0.1.0"
description = "A fidelity-aware academic benchmark for industrial ranking architectures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.scripts]
algo26bench = "algo26bench.bench.run:main"

[tool.setuptools.packages.find]
where = ["src"]
